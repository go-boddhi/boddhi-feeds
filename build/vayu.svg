<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Graphite Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1f26" />
      <stop offset="100%" stop-color="#0e1014" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>

    <!-- GNOME Vayu Blue-Cyan Primary Gradient -->
    <linearGradient id="vayuBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#62a0ea" />
      <stop offset="50%" stop-color="#3584e4" />
      <stop offset="100%" stop-color="#1c71d8" />
    </linearGradient>

    <!-- Cyan Leaf Highlight -->
    <linearGradient id="cyanLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57e3e3" />
      <stop offset="100%" stop-color="#3584e4" />
    </linearGradient>

    <!-- RSS Wave Accent Gradient -->
    <linearGradient id="rssAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78aeed" />
      <stop offset="100%" stop-color="#3584e4" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1c71d8" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- GNOME HIG Compliant Base Squircle -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="2.5" />

  <!-- Inner Bezel Accent -->
  <rect x="34" y="34" width="444" height="444" rx="106" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1.5" />

  <!-- Main Emblem Group -->
  <g filter="url(#shadow)">
    <!-- Primary V-Wing (Left to Bottom-Center to Top-Right) -->
    <path d="M 130 160 C 130 148 140 140 152 144 L 246 338 C 252 350 260 350 266 338 L 360 168 C 366 158 378 160 382 170 L 388 186 C 392 196 388 206 378 214 L 274 374 C 262 392 242 392 230 374 L 134 182 C 131 176 130 168 130 160 Z" fill="url(#vayuBlue)" />

    <!-- Inner Cyan Leaf Swoosh Accent -->
    <path d="M 160 170 C 160 162 168 156 176 160 L 244 300 C 250 312 258 312 264 300 L 334 180 C 338 172 348 170 354 176 L 344 194 L 260 324 C 254 332 246 332 240 324 L 170 186 C 164 178 160 174 160 170 Z" fill="url(#cyanLeaf)" opacity="0.9" />

    <!-- RSS / Digital Garden Signal Waves (Top Right) -->
    <!-- Inner Arc -->
    <path d="M 330 160 A 50 50 0 0 1 380 210" fill="none" stroke="url(#rssAccent)" stroke-width="12" stroke-linecap="round" opacity="0.95" />
    
    <!-- Outer Arc -->
    <path d="M 315 125 A 90 90 0 0 1 405 215" fill="none" stroke="#62a0ea" stroke-width="12" stroke-linecap="round" opacity="0.8" />
    
    <!-- Core Signal Seed Dot -->
    <circle cx="340" cy="195" r="9" fill="#ffffff" />
  </g>
</svg>
