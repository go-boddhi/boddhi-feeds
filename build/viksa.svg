<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Dark Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242432" />
      <stop offset="100%" stop-color="#111116" />
    </linearGradient>

    <!-- Glass Rim Highlight -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03" />
    </linearGradient>

    <!-- Vivid Coral-Crimson Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3355" />
      <stop offset="100%" stop-color="#ff5533" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#ff3355" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Dark Squircle Body -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bgGrad)" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Inner Subtle Border Highlight -->
  <rect x="35" y="35" width="442" height="442" rx="97" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1.5" />

  <!-- RSS Signal Waves (Top Right Corner) -->
  <path d="M 315 160 A 110 110 0 0 1 405 250" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.65" />
  <path d="M 315 200 A 70 70 0 0 1 365 250" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.85" />
  <circle cx="315" cy="250" r="9" fill="#ffffff" opacity="0.9" />

  <!-- Central Viksa Play Triangle Emblem with Glow -->
  <g filter="url(#glow)">
    <path d="M 180 150 C 180 142 188.5 137 195.5 141 L 340 231 C 347 235 347 245 340 249 L 195.5 339 C 188.5 343 180 338 180 330 Z" fill="url(#accentGrad)" />
  </g>

  <!-- Sleek Inner Cutout Motif -->
  <path d="M 215 195 L 285 240 L 215 285 Z" fill="#111116" opacity="0.2" />
</svg>
